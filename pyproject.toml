[project]
name = "gmaps-lead-generator"
version = "0.1.0"
description = "Scrape local business leads from Google Maps and generate personalized outreach emails via the OpenAI API."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47.0",
    "pandas>=2.2.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.38.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
